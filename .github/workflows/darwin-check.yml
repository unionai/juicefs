# Builds the fork for macOS and proves the binary works, WITHOUT publishing
# anything. Deliberately separate from union-release.yml: darwin assets are not
# shipped until a volume can actually be mounted on a Mac, and that needs the
# NFS server (see below). This job is the gate that tells us the fork compiles
# and runs there at all.
#
# Why a native runner and not a cross-compile from Linux, as elsewhere: the
# build needs CGO_ENABLED=1 and it is not optional. `gspt` is behind a `nogspt`
# tag, but `DataDog/zstd` and `hungys/go-lz4` are imported unconditionally by
# pkg/compress, cmd/dump and cmd/load, so there is no pure-Go build to
# cross-compile. A cgo cross-compile to darwin would need the macOS SDK.
# GitHub's macOS runners are free for public repos, which this fork is.
#
# There is no FUSE mount test and there cannot be one: mounting that way on
# macOS needs macFUSE, a kext whose load requires an interactive approval a
# hosted runner cannot give. That is not only a CI limitation — it is the reason
# Union Volumes need an NFS-server mount path on macOS at all. The NFS mount
# below IS tested, through the kernel's own client, because mount_nfs against
# loopback needs neither a kext nor root.
name: darwin check

on:
  push:
    branches:
      - "haytham/darwin-build"
      - "haytham/nfs-server"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/darwin-check.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must stay identical to union-release.yml. A darwin-only tag list would
  # create a platform capability split, which is the class of bug that put us
  # here: with no fork asset for a platform, bundle_juicefs.py silently falls
  # back to upstream juicefs, which has no badger — the flyteplugins-union
  # default metadata store.
  UNION_BUILD_TAGS: nogateway,nowebdav,nocos,nobos,nohdfs,noibmcos,noobs,nooss,noqingstor,nosftp,noswift,noufile,nob2,nonfs,nodragonfly,nomysql,nopg,notikv,noetcd,nocifs,nostorj,noqiniu,notos,noks3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            arch_match: arm64
          - platform: darwin-amd64
            runner: macos-15-intel
            arch_match: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          set -euxo pipefail
          go version
          go build \
            -tags "$UNION_BUILD_TAGS" \
            -ldflags "-s -w \
              -X github.com/juicedata/juicefs/pkg/version.revision=$(git rev-parse --short HEAD) \
              -X github.com/juicedata/juicefs/pkg/version.revisionDate=$(git log -1 --pretty=format:%cd --date=short)" \
            -o juicefs .

      - name: Verify the binary is what we think it is
        run: |
          set -euo pipefail
          # NOTE: never `producer | grep -q` under `set -o pipefail`. grep -q
          # exits at the first match, the producer dies on EPIPE, and pipefail
          # reports that 141 as the pipeline's status — so the check fails
          # precisely *because* it matched. Capture first, then match.
          info=$(file juicefs)
          echo "$info"
          echo "$info" | grep "Mach-O" > /dev/null
          echo "$info" | grep "${{ matrix.arch_match }}" > /dev/null

          ver=$(./juicefs version)
          echo "$ver"
          echo "$ver" | grep "$(git rev-parse --short HEAD)" > /dev/null

          # Union-only surface: absent means the wrong branch got built.
          mount_help=$(./juicefs mount --help 2>&1)
          echo "$mount_help" | grep -- "--slice-domain" > /dev/null
          ./juicefs checkpoint --help > /dev/null 2>&1

          # badger is flyteplugins-union's default metadata store and exists
          # only in this fork.
          strings juicefs > /tmp/juicefs.strings
          grep "dgraph-io/badger" /tmp/juicefs.strings > /dev/null

          echo "verified: a union ${{ matrix.platform }} build with badger"

      - name: Format and inspect a badger volume on local disk
        run: |
          set -euxo pipefail
          # No mount — that needs macFUSE (see the header). This still exercises
          # the whole metadata path on darwin: badger engine open, format write,
          # and read back. A build that dropped badger, or a badger that cannot
          # open on darwin, fails right here instead of on a user's Mac.
          work="$(mktemp -d)"
          ./juicefs format \
            --storage file \
            --bucket "$work/chunks/" \
            "badger://$work/meta" \
            darwin-ci-volume
          ./juicefs status "badger://$work/meta"
          ./juicefs config "badger://$work/meta"

      - name: Mount over NFS and read and write it, no FUSE and no kext
        run: |
          set -euxo pipefail
          work="$(mktemp -d)"
          ./juicefs format \
            --storage file \
            --bucket "$work/chunks/" \
            "badger://$work/meta" \
            nfs-ci-volume

          mkdir -p "$work/mnt"
          # Resolve the mount point to its physical path BEFORE mounting. On
          # macOS /var is a symlink to /private/var, so mktemp -d hands back
          # /var/folders/... while `mount` reports /private/var/folders/... —
          # and grepping for the unresolved path finds nothing even though the
          # mount succeeded, which is exactly how this failed the first time.
          # Resolving after mounting would cd into the mount itself.
          mnt="$(cd "$work/mnt" && pwd -P)"
          echo "mount point resolves to $mnt"

          ./juicefs nfsmount --no-usage-report "badger://$work/meta" "$mnt" \
            > "$work/nfs.log" 2>&1 &
          srv=$!
          # Leave nothing mounted behind on any exit path, successful or not: a
          # stranded NFS mount makes every later step in the job hang.
          trap 'kill -TERM "$srv" 2>/dev/null || true; sleep 2; umount "$mnt" 2>/dev/null || true' EXIT

          # mount_nfs returns before the mount is necessarily visible, and a
          # fixed sleep here would be a flake either way it was wrong.
          for i in $(seq 1 60); do
            if mount | grep -q " on $mnt "; then break; fi
            if ! kill -0 "$srv" 2>/dev/null; then
              echo "::error::the server exited before the mount appeared"
              cat "$work/nfs.log"
              exit 1
            fi
            sleep 1
          done

          mnt_line=$(mount | grep " on $mnt " || true)
          if [ -z "$mnt_line" ]; then
            echo "::error::no mount at $mnt after 60s"
            echo "--- mount table ---"; mount
            echo "--- server log ---"; cat "$work/nfs.log"
            exit 1
          fi
          echo "$mnt_line"
          # Assert it really is NFS. If this ever says macfuse, the test has
          # stopped proving the thing it exists to prove.
          echo "$mnt_line" | grep -i nfs > /dev/null

          # A real read/write round trip through the kernel's NFS client,
          # large enough to span many RPCs at wsize=1M.
          dd if=/dev/urandom of="$work/src.bin" bs=1m count=64

          # Timed, because this is the only honest throughput number in the
          # project: the package benchmarks talk to go-nfs-client, which issues
          # 8 KiB reads whatever the server offers, so their absolute MB/s says
          # nothing about a real mount. Compared against the same copy to local
          # disk on the same runner, which is the ceiling for this hardware.
          #
          # Milliseconds via python3, not `date +%s`: macOS date has no %N, and
          # at second resolution a 64 MiB copy reported "nfs 1s, local 0s",
          # which bounds the answer somewhere between 40 and 130 MB/s and is
          # therefore not an answer. 512 MiB for the same reason.
          now_ms() { python3 -c 'import time; print(int(time.time()*1000))'; }
          mbps() { python3 -c "import sys; mb=float(sys.argv[1]); ms=float(sys.argv[2]); print('%.0f' % (mb*1000.0/ms) if ms > 0 else 'inf')" "$1" "$2"; }

          size_mb=512
          dd if=/dev/urandom of="$work/big.bin" bs=1m count=$size_mb

          t0=$(now_ms); cp "$work/big.bin" "$mnt/big.bin";   t1=$(now_ms)
          t2=$(now_ms); cp "$work/big.bin" "$work/local.bin"; t3=$(now_ms)
          echo "WRITE ${size_mb}MiB  nfs $(mbps $size_mb $((t1-t0))) MB/s   local $(mbps $size_mb $((t3-t2))) MB/s"

          # Drop the client's cache first, or the read is served from memory and
          # measures nothing. umount/remount is the portable way to do that on
          # macOS without purge(8), which needs root.
          t4=$(now_ms); cat "$mnt/big.bin" > /dev/null;      t5=$(now_ms)
          t6=$(now_ms); cat "$work/local.bin" > /dev/null;    t7=$(now_ms)
          echo "READ  ${size_mb}MiB  nfs $(mbps $size_mb $((t5-t4))) MB/s   local $(mbps $size_mb $((t7-t6))) MB/s"
          echo "NOTE: both reads may be served from the page cache; treat them as an upper bound."

          rm -f "$work/big.bin" "$work/local.bin" "$mnt/big.bin"

          cmp "$work/src.bin" "$mnt/data.bin"

          # Metadata operations, and read back what another process wrote.
          mkdir "$mnt/dir"
          echo "written through the kernel NFS client" > "$mnt/dir/note"
          ls -la "$mnt" "$mnt/dir"
          grep -q "kernel NFS client" "$mnt/dir/note"
          rm "$mnt/dir/note"
          test ! -e "$mnt/dir/note"

          # Shut down through the signal path, which is what unmounts and
          # flushes; then prove the mount is gone.
          kill -TERM "$srv"
          for i in $(seq 1 30); do
            if ! mount | grep -q " on $mnt "; then break; fi
            sleep 1
          done
          if mount | grep -q " on $mnt "; then
            echo "::error::still mounted after SIGTERM"
            exit 1
          fi
          cat "$work/nfs.log"
          # The handle pool is the whole performance argument; assert it worked
          # rather than trusting that the transfer completing means it did.
          grep -E "handles: [0-9]+ opened, [0-9]+ reused" "$work/nfs.log"

      - uses: actions/upload-artifact@v4
        with:
          name: juicefs-${{ matrix.platform }}
          path: juicefs
          retention-days: 7
